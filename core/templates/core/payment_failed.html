{% extends "base.html" %}

{% block content %}

<div style="text-align:center; padding:50px;">
    <h1 style="color:red;"> Payment Failed</h1>
    <p>Sorry, your payment was not completed successfully.</p>
    {% if payment_error %}
    <p style="color:#555; max-width:700px; margin:20px auto; line-height:1.6;">
        {{ payment_error }}
    </p>
    {% endif %}

    <a href="/" style="padding:10px 20px; background:red; color:white; text-decoration:none;">
        Go to Home
    </a>
</div>

{% endblock %}
