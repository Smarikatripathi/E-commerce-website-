{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container" style="max-width:900px; margin:auto; padding:20px;">

    <h2 style="text-align:center;">Checkout</h2>

    <!-- ORDER SUMMARY -->
    <div style="border:1px solid #ddd; padding:15px; margin-bottom:20px;">
        <h4>Order Summary</h4>

        {% for product in products %}
            <div style="display:flex; justify-content:space-between;">
                <span>{{ product.title }} (x{{ product.quantity }})</span>
                <span>Rs. {{ product.total }}</span>
            </div>
        {% endfor %}

        <hr>
        <h4 style="text-align:right;">Total: Rs. {{ total_price }}</h4>
    </div>

    <!-- ================= COD FORM ================= -->
    <form method="POST" action="{% url 'core:place_order' %}">
        {% csrf_token %}

        <input type="text" name="full_name" placeholder="Full Name" required class="form-control"><br>
        <input type="text" name="address" placeholder="Address" required class="form-control"><br>
        <input type="text" name="phone" placeholder="Phone" required class="form-control"><br>

        <button type="submit" name="payment_method" value="cod"
            style="width:100%; padding:10px; background:black; color:white;">
            Cash on Delivery
        </button>

        <hr style="margin:30px 0;">

        <!-- ================= KHALTI BUTTON ================= -->
        <button type="submit" name="payment_method" value="khalti"
            style="width:100%; padding:10px; background:purple; color:white;">
            Pay with Khalti
        </button>
    </form>

</div>

{% endblock %}
<!-- ================= KHALTI SCRIPT ================= -->
{% comment %} <script src="https://khalti.com/static/khalti-checkout.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    if (typeof KhaltiCheckout === "undefined") {
        alert("Khalti script not loaded!");
        return;
    }

    var config = {
        publicKey: "{{ KHALTI_PUBLIC_KEY }}",
        productIdentity: "ORDER_{{ request.user.id }}",
        productName: "Ecommerce Order",
        productUrl: window.location.href,

        eventHandler: {
            onSuccess(payload) {
                console.log("SUCCESS:", payload);

                fetch("{% url 'core:verify_khalti' %}", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": "{{ csrf_token }}"
                    },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);

                    if (data.message === "Payment Successful") {
                        window.location.href = "/";
                    }
                })
                .catch(err => {
                    console.log(err);
                    alert("Verification error");
                });
            },

            onError(error) {
                console.log("Khalti Error:", error);
                alert("Payment Failed");
            },

            onClose() {
                console.log("Khalti closed");
            }
        }
    };

    var checkout = new KhaltiCheckout(config);

    document.getElementById("khalti-button").addEventListener("click", function () {

        let amount = parseInt("{{ total_price|default:0 }}") * 100;

        if (!amount || amount <= 0) {
            alert("Invalid total amount");
            return;
        }

        checkout.show({
            amount: amount
        });
    });

});
</script> {% endcomment %}
